name: CI

# Corre en cada PR contra main (gate antes de mergear) y en cada push a main
# (red de seguridad post-merge, por si dos PRs que pasaban por separado
# quedan mal combinados). Todavia no hay proteccion de rama configurada en
# GitHub -- eso es el proximo paso, una vez que este workflow este validado.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Corre la suite de pytest (Horizonte 1 del roadmap) en cada cambio
  # propuesto -- gate real antes de mergear, no solo un smoke test.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # Mismas librerias de sistema que instala el Dockerfile: pyswisseph
      # y weasyprint se importan al cargar app.services/app.domain aunque
      # los tests no los ejerciten directamente.
      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  # Valida que la app se pueda instalar y arrancar de punta a punta, tal
  # como quedaria en un entorno recien clonado (mismo escenario que un
  # dev nuevo o un deploy desde cero).
  app-smoke-test:
    name: App smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # Mismas librerias de sistema que instala el Dockerfile para que
      # WeasyPrint pueda importarse (Pango/Cairo). Si esto falta, ni
      # siquiera "pip install -r requirements.txt" corrupto se notaria
      # como error de WeasyPrint -- se ve recien al importar app.main.
      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Falla rapido ante un error de sintaxis, un import roto, o un error
      # de inicializacion a nivel de modulo (ej. algo que rompa al crear
      # el engine de SQLAlchemy o el cliente de Anthropic) antes de pagar
      # el costo de levantar el servidor completo.
      - name: Import check
        run: python -c "from app.main import app"

      # El schema ya no lo crea la app sola (create_all se saco de main.py,
      # ver TECH_DEBT.md #7) -- corre las migraciones primero, igual que
      # el Dockerfile antes de levantar uvicorn.
      - name: Run migrations
        run: alembic upgrade head

      # Levanta la app real con uvicorn sobre esa SQLite nueva del runner
      # (igual que un entorno recien clonado) y confirma que responde en
      # /health. Es la verificacion mas cercana a "la app arranca en
      # produccion" que se puede hacer sin desplegar de verdad.
      - name: Boot check
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "La app respondio OK en /health"
              kill "$SERVER_PID"
              exit 0
            fi
            sleep 1
          done
          echo "La app no respondio en /health despues de 15s"
          kill "$SERVER_PID" || true
          exit 1

  # Valida que el Dockerfile sigue compilando -- el mismo artefacto que
  # Railway construye en cada deploy real. No publica la imagen a ningun
  # registry: Railway ya construye la suya propia al desplegar, este job
  # solo confirma que el build no esta roto antes de llegar a main.
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t astrea-api-ci:${{ github.sha }} .
